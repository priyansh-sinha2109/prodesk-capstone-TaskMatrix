openapi: 3.0.3
info:
  title: TaskMatrix proposed API
  version: 0.1.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refresh:
      type: apiKey
      in: cookie
      name: refresh
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
paths:
  /auth/register:
    post:
      summary: Register
      description: 'Public. '
      security: []
      parameters: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  displayName:
                    type: string
                required:
                  - id
                  - email
                  - displayName
                additionalProperties: false
              example:
                id: aaaaaaaaaaaaaaaaaaaaaaaa
                email: alex@example.test
                displayName: Alex
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        minLength: 1
                        maxLength: 100
                      message:
                        type: string
                        minLength: 1
                        maxLength: 100
                      requestId:
                        type: string
                        minLength: 1
                        maxLength: 100
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
